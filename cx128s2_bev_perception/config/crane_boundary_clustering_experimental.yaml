# Crane Slope Boundary + Constrained Region Growing Clustering Experimental Parameters
# Can be loaded as params_overlay_file on top of cx128s2_bev_perception.yaml
/cx128s2_bev_perception:
  ros__parameters:
    perception_mode: "crane_beam_work"
    crane_pipeline: "slope"
    target_frame: "world"
    use_tf_transform: true
    fallback_to_raw_frame: false
    publish_debug_topics: true
    publish_debug_valid_points: false
    debug_cloud_max_points: 0
    debug_cloud_publish_period_sec: 0.0

    crane_slope:
      # CX128S2 Optical & Grid Configuration
      azimuth_columns: 666
      lidar_channels: 128
      lidar_model: "cx128s2"
      cx128s2_prism_offset_deg: 0.0
      cx128s2_prism_angles_deg: [0.0, -0.17, -0.34, -0.51]
      model_angle_tolerance_deg: 0.25

      # Slope Baseline Parameters
      max_slope_degree: 10.0
      max_vertical_height: 0.08
      ground_z: 0.0
      force_ground_below_z: -0.10
      include_ground_in_clustering: false
      horizontal_enabled: true
      horizontal_max_azimuth_gap_deg: 0.5

      # Debug Topic Outputs
      publish_debug_clouds: true
      publish_colored_cloud: true
      publish_direction_clouds: true

      # Slope Boundary + Constrained Region Growing Clustering
      boundary_clustering:
        enabled: true
        slope_threshold_deg: 30.0          # Steep slope threshold [deg] for edge severing
        height_step_threshold: 0.10        # Height discontinuity step [m]
        range_jump_threshold: 0.25         # Range discontinuity jump [m]
        max_neighbor_distance: 0.40        # Maximum Euclidean distance between adjacent grid points [m]
        min_height_above_ground: 0.05      # Minimum clearance above ground_z for cluster points [m]
        min_cluster_points: 15             # Minimum point count for a valid cluster
        max_cluster_points: 10000          # Maximum point count
        include_unknown: true              # Allow UNKNOWN points (aerial objects, crane hook/load)
        enable_morphological_closing: true # 2D BEV morphological closing to bridge minor occlusion gaps
        morph_closing_radius_m: 0.15       # Radius for BEV morphological closing [m]

      # Z-Axis Gaussian Grouping + Existing BevConnectedComponentClusterer
      z_gaussian_clustering:
        enabled: true                      # Group candidate points along Z-axis using 1D Gaussian model before BEV clustering
        sigma_z: 0.035                     # Base 1D Z Gaussian standard deviation [m] (tuned from 0.030m for layer split stabilization)
        range_sigma_factor: 0.002          # Additional sigma_z per meter of horizontal range [m/m]
        confidence_sigma_multiplier: 3.0   # Confidence band multiplier k (|z - mu_z| <= k * sigma_eff) (tuned from 2.5)
        step_sigma_multiplier: 3.0         # Adjacent sorted Z jump multiplier
        max_layer_z_spread: 0.35           # Maximum thickness of a single Z-Gaussian layer [m]
        min_height_above_ground: 0.05      # Minimum height clearance above ground_z [m]
        min_layer_points: 5                # Minimum points to keep a Z-Gaussian layer (protect sparse wire reflections)

      # XY Closed Loop Containment Object Grouping + Subcluster Delta-Z Tracking
      closed_loop_grouping:
        enabled: false                     # Group subclusters inside XY closed loops (Omega_C) regardless of Z height gap
        grid_resolution_m: 0.08            # 2D XY grid cell size for closed-loop detection [m]
        closing_radius_m: 0.16             # Morphological closing radius to bridge minor loop perimeter gaps [m]
        min_containment_ratio: 0.70        # Inside(K_i, Omega_C) cell overlap ratio threshold [0..1]
        min_enclosed_cells: 4              # Minimum enclosed interior hole cells to form a valid closed loop
        use_boundary_points_for_loop: false # Use all subcluster points (false) or boundary points only (true)
        subcluster_match_xy_gate: 0.45     # Frame-to-frame XY centroid association gate [m]
        subcluster_match_z_gate: 0.40      # Frame-to-frame Z centroid association gate [m]

      # FSM State & ROI Pre-filtering Integration: P_s = {p_i in P | p_i in R_s}
      roi_filter:
        enabled: true                      # Pre-clustering ROI filtering
        only_crane_roi: true               # Compute strictly inside Crane ROI (Beam ROI), ignoring state
        active_include_background: false   # If true, retain Background ROI clustering alongside Crane ROI in active states
        expand_beam_roi: false             # Keep clustering strictly inside Hook / Crane ROI

      # Top-Down Hook Chain Connection Limits (Slope & Turn Angle Constraints)
      top_down_hook:
        max_slope_angle_deg: 35.0   # [deg] Absolute slope angle limit from vertical (0°=downward)
        max_turn_angle_deg: 40.0    # [deg] Max turn angle change from previous edge

      # Fixed Root ROI and Geometric Center Reference (Zero-Jitter Hook Chain Root)
      fixed_root:
        enabled: true
        left_roi:
          x_min: -1.25
          x_max: -0.55
          y_min: -0.25
          y_max: 0.35
          z_min: 4.95
          z_max: 5.55
        right_roi:
          x_min: 0.72
          x_max: 1.42
          y_min: -0.25
          y_max: 0.35
          z_min: 5.00
          z_max: 5.60
        min_points: 15
        hold_frames: 3
        motion_speed_threshold: 0.12
        motion_disp_threshold: 0.08
        motion_confirm_frames: 3

      # Top-Down Hook Chain Connection Line Stabilization (Orange <-> Blue Toggle Smoothing)
      connection_stabilization:
        enabled: true
        history_frames: 10
        min_direct_frames: 4
        min_transition_count: 0
        missing_hold_frames: 3
        spatial_continuity_enabled: true
        spatial_min_direct_frames: 1
        spatial_max_gap_z: 0.80
        spatial_max_dxy: 0.35

      # Layer-wise Dual-ROI Anchoring & Motion Monitoring
      dual_roi_anchor:
        enabled: true
        publish_markers: true
        fixed_roi_size_xy: 0.36        # [m] Fixed Monitoring ROI XY span (36cm)
        fixed_roi_size_z: 0.40         # [m] Fixed Monitoring ROI Z height (40cm)
        moving_roi_size_xy: 0.60       # [m] Moving Monitoring ROI XY span (60cm)
        moving_roi_size_z: 0.56        # [m] Moving Monitoring ROI Z height (56cm)
        confirm_frames: 3              # Frames required to lock Fixed Anchor
        min_direct_evidence_frames: 2  # Min direct observation frames
        max_lock_slope_deg: 28.0       # Max slope angle [deg] for initial straightness check
        max_lock_turn_deg: 30.0        # Max turn angle [deg] for initial straightness check
        noise_deadband_xy: 0.06        # [m] Stationary XY jitter deadband (6cm)
        noise_deadband_z: 0.08         # [m] Stationary Z jitter deadband (8cm)
        relocate_thresh_xy: 0.10       # [m] Genuine displacement threshold for relocation
        relocate_thresh_z: 0.12        # [m] Genuine Z displacement threshold for relocation
        relocate_confirm_frames: 3     # Consecutive frames to confirm relocation
        anchor_memory_frames: 30       # Memory frames for return-to-anchor recovery
        beam_intrusion_guard_enabled: true
        beam_min_length_m: 0.80        # [m] Min length to identify cargo beam intrusion
        beam_min_aspect_ratio: 2.2     # Min aspect ratio for beam classification
        intrusion_hold_frames: 50      # Frames to hold wire anchor during beam occlusion

      # Z-axis Temporal Median Filter (Window = 3)
      z_temporal_median:
        enabled: true
        window_frames: 3

      # Virtual Rope Centerline & 2-Strand Wire Bundle
      virtual_rope:
        enabled: true
        wire_min_spacing_m: 0.10       # [m] Min separation to qualify as 2 distinct strands
        wire_max_spacing_m: 0.45       # [m] Max separation to belong to same wire bundle
        wire_merge_span_m: 0.16        # [m] Span threshold below which strands are considered overlapped
        memory_frames: 30              # Frames to remember 2-strand relative spacing and orientation
        publish_markers: true          # Visualize Virtual Rope Centerline in RViz

      # Lower Sheave (도르래 바퀴/회전축) Detection & Virtual Rope Termination
      sheave:
        # Reviewed observation library: immutable online; source center is metadata only.
        # One USER_SEEDED condition (~2.50m). Old candidates remain PROBABLE, not same-object truth.

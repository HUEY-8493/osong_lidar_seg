        enabled: true
        min_radius_m: 0.08             # [m] Min plausible sheave radius (8cm)
        max_radius_m: 0.28             # [m] Max plausible sheave radius (28cm)
        default_radius_m: 0.155        # [m] Nominal sheave radius when partially observed (15.5cm)
        min_arc_points: 12             # Min points along wheel contour for direct circle fit
        max_circle_rms_m: 0.055        # [m] Max RMS error to accept direct circle fit (55mm)
        max_sheave_width_m: 0.55       # [m] Max horizontal span to reject cargo beam
        surface_gap_m: 0.08           # Connected broad surfaces across 4x4x3 cm voxel/layer splits
        confirm_frames: 2              # Consecutive direct housing observations (axis remains UNKNOWN)
        terminate_chain_at_sheave: true # Output only; requires independently observed, reliable axis
        publish_markers: true          # Publish sheave cylinder, axis and center in RViz

      # Default-enabled downstream work-cycle FSM and independent Raw boundary motion.
      # Existing detectors, accumulation and Wire/Housing tracking are unaffected.
      work_status:
        enabled: false  # Existing legacy option retained.
        virtual_hook_offset_z_m: 0.9  # User-selected trial; world Z-up, Housing tracked center minus offset.
        fsm_enabled: true
        boundary_motion_enabled: true
        cargo_roi_width_x_m: 1.20
        cargo_roi_width_y_m: 1.20
        cargo_start_offset_m: 0.15  # 3 x existing 5cm occupancy cells
        cargo_confirm_sec: 2.0
        cargo_loss_sec: 1.3
        lifting_event_hold_sec: 0.5
        lifting_clearance_delta_m: 0.0  # 0: existing max(Z deadband, Z relocation)=0.12m
        lifting_min_clearance_m: 0.0    # 0: existing max(Z deadband, placement tolerance)=0.08m
        cargo_min_surface_width_m: 0.15
        cargo_min_fill_ratio: 0.35  # Reject sparsely occupied rope/V outlines
        boundary_search_radius_m: 0.60  # Existing hook connection margin
        boundary_min_coherent_points: 4  # Independent majority of 8 patches

      # Size-based 1st Exception Gate with FOV / Visibility Integration
      exception_gate:
        enabled: true
        min_length_m: 0.80
        min_area_m2: 0.15
        use_visibility: true
        max_occlusion_fraction: 0.40
        scan_all_chain_nodes: true

      # Pre-Z-Gaussian PointCloud Temporal Accumulation & Stabilization
      temporal_stabilization:
        enabled: true
        mode: "sliding_window"      # "sliding_window" or "batch"
        window_size: 5              # 5 or 10 frames
        voxel_size_xy: 0.04         # [m]
        voxel_size_z: 0.03          # [m]
        min_hit_count: 2            # persistent observation threshold across window (transient noise rejection)
        temporal_stabilization_enabled: true
        stabilization_alpha: 0.20
        jump_tolerance_length: 0.50 # [m]
        jump_tolerance_width: 0.25  # [m]
        jump_confirm_frames: 3
        max_hold_missed_frames: 3
        node_confirm_frames: 2
        node_max_hold_frames: 2
        largest_swap_confirm_frames: 3
        largest_match_dist: 0.50
        yaw_jump_tolerance_deg: 30.0
        yaw_alpha: 0.15

    # Crane ROI and Background ROI Bounds
    crane_beam:
      publish_background_roi_marker: false # Do not show yellow Background ROI box
      beam_roi_x_min: -2.0
      beam_roi_x_max: 2.0
      beam_roi_y_min: -2.0
      beam_roi_y_max: 2.0
      beam_roi_z_min: -0.5

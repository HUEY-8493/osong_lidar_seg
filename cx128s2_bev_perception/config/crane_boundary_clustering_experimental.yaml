      background_roi_y_min: -8.0
      background_roi_y_max: 8.0
      background_roi_z_min: -0.5
      background_roi_z_max: 7.5
      hook:
        roi_left_x_min: -1.40
        roi_left_x_max: -0.60
        roi_right_x_min: 0.60

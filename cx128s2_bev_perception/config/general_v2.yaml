/**:
  ros__parameters:
    # Independent engine. No static background, legacy memory bank or Crane FSM.
    perception_mode: default
    background_mode: ground_only
    obstacle_min_height_above_ground: 0.20
    obstacle_max_height_above_ground: 5.0
    general_v2:
      # Geometric ground seed envelope in the configured world frame, not a map.
      # Floor samples are read below the legacy valid_z_min obstacle crop.
      ground_crop_z_min: -2.0
      ground_seed_min_z: -1.0
      ground_seed_max_z: 1.0
      ground_tile_m: 2.0
      ground_inlier_m: 0.12
      ground_max_slope: 0.20
      ground_min_span_m: 3.0
      ground_min_tiles: 12
      ground_min_points: 6
      # Current-frame, thin, ground-connected surface returns only; no static map.
      ground_local_cell_m: 0.5
      ground_local_band_m: 0.12
      ground_local_max_rise_m: 1.0
      ground_local_max_slope: 0.25
      ground_local_residual_m: 0.06
      ground_local_min_points: 6
      # Native candidate admission: measured floor + concentrated low beam returns.
      candidate_ground_noise_rejection: true
      cell_m: 0.30
      connection_gap_m: 0.48
      vertical_gap_m: 0.60
      min_points: 25
      min_cells: 4
      max_objects: 128
      max_cells: 200000
      vehicle_min_length_m: 2.5
      confirmation_sec: 0.5
      confirmation_hits: 3
      hold_sec: 1.3
      candidate_hold_sec: 0.3
      reid_sec: 10.0
      association_gate_m: 2.5
      extent_confirmation_sec: 2.0
      extent_growth_sec: 0.3
      partial_ratio: 0.8
      motion_window_sec: 0.8
      moving_speed_mps: 0.3
      stationary_speed_mps: 0.15
      motion_confirmation_sec: 0.3
